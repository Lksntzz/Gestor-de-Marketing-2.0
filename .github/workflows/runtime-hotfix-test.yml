name: Windows Runtime Hotfix Test

on:
  push:
    branches: ["fix/v1.0.1-runtime-connectivity"]

permissions:
  contents: read

jobs:
  build-windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify
      - name: Build Windows NSIS & Portable Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder@26.0.12 --win --x64 --publish never
      - name: Upload Windows Test Installers
        uses: actions/upload-artifact@v4
        with:
          name: Nisti-Marketing-Hub-1.0.1-Windows-Runtime-Test
          path: dist-electron/*.exe
