name: CI Quality Gate

on:
  push:
    branches: [ "main", "master", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: npm run lint

      - name: Run Bun Test Suite
        run: npm run test

      - name: Run Node Integration Tests
        run: npm run test:node

      - name: Build Web Client, Hardened Backend & Electron Entrypoints
        run: npm run build

      - name: Smoke Test Self-Contained Production Backend
        run: npm run smoke:backend
