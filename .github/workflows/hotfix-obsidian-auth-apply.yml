name: Apply Obsidian Auth Validation Hotfix

on:
  push:
    branches:
      - hotfix/3.1.1-obsidian-tls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require authenticated true from Local REST API
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('src/services/api.ts')
          text = api.read_text(encoding='utf-8')
          old = '''    if (directRes.ok) {
      console.log("Direct browser-to-Obsidian connection succeeded!");
      const data = await directRes.json().catch(() => ({}));
      useDirectClientSideFetch = true;
      return {
        res: { ok: true, status: 200 } as Response,
        data: { success: true, message: "Conectado diretamente pelo navegador.", ...data },
      };
    } else {
      useDirectClientSideFetch = true;
      const data = await directRes.json().catch(() => ({}));
      return {
        res: directRes,
        data: { success: false, message: `Obsidian respondeu com status HTTP ${directRes.status}. Verifique o token/chave de autenticação.`, ...data },
      };
    }
'''
          new = '''    const data = await directRes.json().catch(() => ({}));
    useDirectClientSideFetch = true;
    if (directRes.ok && data?.authenticated === true) {
      console.log("Direct browser-to-Obsidian authenticated connection succeeded!");
      return {
        res: { ok: true, status: 200 } as Response,
        data: { success: true, message: "Conectado e autenticado no Obsidian Local REST API.", ...data },
      };
    }
    if (directRes.ok && data?.authenticated === false) {
      return {
        res: { ok: false, status: 401 } as Response,
        data: {
          success: false,
          status: 401,
          message: "O Local REST API respondeu, mas a API Key não autenticou. Copie novamente a chave exibida no plugin do Obsidian.",
          ...data,
        },
      };
    }
    return {
      res: directRes,
      data: { success: false, message: `Obsidian respondeu com status HTTP ${directRes.status}. Verifique o token/chave de autenticação.`, ...data },
    };
'''
          if old not in text:
              raise SystemExit('api.ts auth block not found')
          api.write_text(text.replace(old, new, 1), encoding='utf-8')

          server = Path('server.ts')
          text = server.read_text(encoding='utf-8')
          old = '''      const response = await fetch(`${parsedUrl.protocol}//${parsedUrl.host}/`, {
        method: "GET",
        headers: { Authorization: `Bearer ${finalApiKey}`, Accept: "application/json" },
        signal: controller.signal,
      });
      if (response.ok) return res.json({ success: true, message: "Conectado com sucesso ao Obsidian Local REST API." });
      return res.json({ success: false, status: response.status, message: `Obsidian REST API retornou HTTP ${response.status}` });
'''
          new = '''      const response = await fetch(`${parsedUrl.protocol}//${parsedUrl.host}/`, {
        method: "GET",
        headers: { Authorization: `Bearer ${finalApiKey}`, Accept: "application/json" },
        signal: controller.signal,
      });
      const payload = await response.json().catch(() => ({}));
      if (response.ok && payload?.authenticated === true) {
        return res.json({ success: true, message: "Conectado e autenticado com sucesso ao Obsidian Local REST API." });
      }
      if (response.ok && payload?.authenticated === false) {
        return res.json({ success: false, status: 401, message: "O Local REST API respondeu, mas a API Key não autenticou." });
      }
      return res.json({ success: false, status: response.status, message: `Obsidian REST API retornou HTTP ${response.status}` });
'''
          if old not in text:
              raise SystemExit('server.ts auth block not found')
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/obsidianConnectionAuthContract.test.ts')
          test.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "fs";\n\ndescribe("Obsidian connection authentication contract", () => {\n  test("renderer requires authenticated=true instead of accepting HTTP 200 alone", () => {\n    const source = readFileSync("src/services/api.ts", "utf8");\n    expect(source).toContain("directRes.ok && data?.authenticated === true");\n    expect(source).toContain("directRes.ok && data?.authenticated === false");\n    expect(source).toContain("API Key não autenticou");\n  });\n\n  test("backend connection probe also requires authenticated=true", () => {\n    const source = readFileSync("server.ts", "utf8");\n    expect(source).toContain("response.ok && payload?.authenticated === true");\n    expect(source).toContain("response.ok && payload?.authenticated === false");\n  });\n});\n''', encoding='utf-8')
          PY
      - name: Commit auth validation hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/api.ts server.ts tests/obsidianConnectionAuthContract.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: require authenticated Obsidian REST session"
          git push origin HEAD:hotfix/3.1.1-obsidian-tls
