name: Apply Obsidian TLS Hotfix

on:
  push:
    branches:
      - hotfix/3.1.1-obsidian-tls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted Electron certificate policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('electron-bootstrap.ts')
          text = path.read_text(encoding='utf-8')
          marker = '''if (!hasSingleInstanceLock) {
            app.quit();
          }
          '''
          policy = '''if (!hasSingleInstanceLock) {
            app.quit();
          }

          // Obsidian Local REST API uses a self-signed HTTPS certificate by default.
          // Trust is scoped to the official loopback HTTPS endpoint only; all other
          // certificate decisions remain under Chromium's default verification.
          const TRUSTED_OBSIDIAN_TLS_ENDPOINTS = new Set([
            "127.0.0.1:27124",
            "localhost:27124",
            "[::1]:27124",
          ]);

          app.on("certificate-error", (event, _webContents, requestUrl, _error, _certificate, callback) => {
            try {
              const target = new URL(requestUrl);
              if (target.protocol === "https:" && TRUSTED_OBSIDIAN_TLS_ENDPOINTS.has(target.host)) {
                event.preventDefault();
                callback(true);
                return;
              }
            } catch {
              // Invalid certificate URL: keep Electron's secure default behavior.
            }
            callback(false);
          });
          '''
          if 'TRUSTED_OBSIDIAN_TLS_ENDPOINTS' not in text:
              if marker not in text:
                  raise SystemExit('electron-bootstrap insertion marker not found')
              text = text.replace(marker, policy, 1)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/obsidianElectronTlsPolicy.test.ts')
          test.write_text('''import { describe, expect, test } from "bun:test";\nimport { readFileSync } from "fs";\n\ndescribe("Obsidian Electron TLS policy", () => {\n  const source = readFileSync("electron-bootstrap.ts", "utf8");\n\n  test("trusts only the official Local REST API HTTPS loopback endpoint", () => {\n    expect(source).toContain("127.0.0.1:27124");\n    expect(source).toContain("localhost:27124");\n    expect(source).toContain("TRUSTED_OBSIDIAN_TLS_ENDPOINTS.has(target.host)");\n    expect(source).toContain("target.protocol === \\\"https:\\\"");\n  });\n\n  test("does not disable TLS verification globally", () => {\n    expect(source).not.toContain("NODE_TLS_REJECT_UNAUTHORIZED");\n    expect(source).not.toContain("rejectUnauthorized: false");\n    expect(source).toContain("callback(false)");\n  });\n});\n''', encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron-bootstrap.ts tests/obsidianElectronTlsPolicy.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: trust Obsidian self-signed TLS on loopback"
          git push origin HEAD:hotfix/3.1.1-obsidian-tls
