name: Apply Obsidian 3.1.3 Auth Separation

on:
  push:
    branches:
      - hotfix/3.1.3-obsidian-runtime-stability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate authentication from Base preparation
        run: node scripts/apply-obsidian-313-auth-separation.mjs
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/api.ts tests/obsidianRuntimeStability.test.ts
          git commit -m "fix: separate Obsidian auth from Base preparation"
          git push origin HEAD:hotfix/3.1.3-obsidian-runtime-stability
