name: Release Nisti Marketing 2.x

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v2.1.4). Deixe vazio para usar package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-sign-and-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Resolve and Validate Release Version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "package.json não possui version válida."
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requested = "${{ inputs.version }}".Trim()
            if ([string]::IsNullOrWhiteSpace($requested)) {
              $releaseTag = "v$packageVersion"
            } else {
              $releaseTag = $requested
            }
          } else {
            $releaseTag = "${{ github.ref_name }}"
          }

          if ($releaseTag -ne "v$packageVersion") {
            throw "Versão inconsistente: tag/input '$releaseTag' não corresponde a package.json '$packageVersion'."
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release validado: $releaseTag"

      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify

      - name: Smoke Test Self-Contained Production Backend
        run: node scripts/runtime-smoke.mjs

      - name: Require Trusted Windows Signing Credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "WIN_CSC_LINK não configurado. Release público sem assinatura é bloqueado."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "WIN_CSC_KEY_PASSWORD não configurado. Release público sem assinatura é bloqueado."
          }

      - name: Build Signed Windows NSIS and Portable Installers
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder@26.0.12 --win --x64 --publish never --config.win.forceCodeSigning=true

      - name: Verify Authenticode Signatures
        shell: pwsh
        run: |
          $executables = Get-ChildItem -Path dist-electron -Filter *.exe
          if ($executables.Count -eq 0) { throw "Nenhum executável Windows foi gerado." }
          foreach ($exe in $executables) {
            $signature = Get-AuthenticodeSignature $exe.FullName
            if ($signature.Status -ne "Valid") {
              throw "Assinatura Authenticode inválida em $($exe.Name): $($signature.Status)"
            }
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | Publisher {1} | SHA256 {2}" -f $exe.Name, $signature.SignerCertificate.Subject, $hash)
          }

      - name: List Release Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path dist-electron -File | Where-Object {
            $_.Extension -in ".exe", ".yml", ".blockmap"
          } | ForEach-Object {
            Write-Host ("Release asset: {0} | {1} bytes" -f $_.Name, $_.Length)
          }

      # Deliberately do not use actions/upload-artifact here.
      # The same installers are published once as GitHub Release assets below,
      # avoiding duplicate GitHub Actions storage consumption.
      - name: Create GitHub Release and Attach Installers/Updater Metadata
        uses: softprops/action-gh-release@v2
        with:
          name: Nisti Marketing ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
