name: Patch Stage 1 Settings

on:
  push:
    branches:
      - feat/3.1-smart-knowledge-stage1
    paths:
      - scripts/patch-stage1-settings.py
      - .github/workflows/patch-stage1-settings.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3.1-smart-knowledge-stage1
          fetch-depth: 0
      - name: Patch settings copy
        run: python3 scripts/patch-stage1-settings.py
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/patch-stage1-settings.py
          rm -f .github/workflows/patch-stage1-settings.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Obsidian settings with REST-first flow"
          git push origin HEAD:feat/3.1-smart-knowledge-stage1
