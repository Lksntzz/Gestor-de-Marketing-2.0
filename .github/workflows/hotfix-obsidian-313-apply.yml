name: Apply Obsidian 3.1.3 Runtime Stability Hotfix

on:
  push:
    branches:
      - hotfix/3.1.3-obsidian-runtime-stability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime stability corrections
        run: node scripts/apply-obsidian-313-hotfix.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/api.ts src/services/storage/StorageManager.ts server.ts package.json src/utils/reliability.ts tests/obsidianRuntimeStability.test.ts
          git commit -m "fix: stabilize Obsidian runtime connection state"
          git push origin HEAD:hotfix/3.1.3-obsidian-runtime-stability
