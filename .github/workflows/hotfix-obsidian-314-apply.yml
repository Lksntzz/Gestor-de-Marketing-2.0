name: Apply Obsidian 3.1.4 Full Vault Read

on:
  push:
    branches:
      - hotfix/3.1.4-obsidian-full-vault-read

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full Vault read corrections
        run: python3 scripts/apply-obsidian-314-full-vault-read.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/api.ts src/services/creationGenerationClient.ts src/domain/smartKnowledgeStage2.ts package.json src/utils/reliability.ts tests/obsidianFullVaultRead.test.ts
          git commit -m "fix: read full Obsidian Vault and reuse REST knowledge"
          git push origin HEAD:hotfix/3.1.4-obsidian-full-vault-read
