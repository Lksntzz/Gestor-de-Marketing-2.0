name: Apply Product Consolidation

on:
  push:
    branches: [ "refactor/product-consolidation" ]
    paths:
      - "scripts/apply-product-consolidation.mjs"
      - ".github/workflows/apply-product-consolidation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: refactor/product-consolidation
          fetch-depth: 0

      - name: Apply deterministic transformations
        run: node scripts/apply-product-consolidation.mjs

      - name: Commit transformed production files
        run: |
          if git diff --quiet; then
            echo "No transformations pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron-main.ts src/services/api.ts src/services/knowledge/KnowledgeContextService.ts src/services/knowledge/EpistemicClassifier.ts src/services/storage/StorageManager.ts src/domain/appStateSchemas.ts src/data/defaultVault.ts
          git commit -m "refactor: consolidate Vault knowledge pipeline"
          git push origin HEAD:refactor/product-consolidation
