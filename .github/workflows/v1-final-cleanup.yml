name: V1 Final UI Cleanup

on:
  push:
    paths:
      - .github/workflows/v1-final-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run final v1 ui cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused V1 cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              expected = count if count is not None else 1
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Cofre: task extraction is review-only, never automatic creation.
          replace('src/components/VaultView.tsx', 'Extrair tarefas', 'Revisar tarefas')
          replace(
              'src/components/VaultView.tsx',
              'Esta fonte está PENDENTE. Revise ou confirme o conhecimento antes de utilizá-lo para gerar campanha ou tarefas.',
              'Esta fonte está PENDENTE. Revise ou confirme o conhecimento antes de utilizá-lo no marketing ou revisar ações.'
          )

          # App legacy callback: consume review candidates only and never promote them to MarketingTask.
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              'if (res.success && res.data?.extractedTasks) {\n            tasksData = res.data;\n          } else {',
              'if (res.success && res.data) {\n            tasksData = res.data;\n          } else {'
          )
          start = text.index('      if (tasksData?.extractedTasks) {', text.index('const handleExtractTasksFromNote'))
          end = text.index('    } catch (err: any) {', start)
          replacement = '''      const reviewCandidates = Array.isArray(tasksData?.reviewCandidates)\n        ? tasksData.reviewCandidates\n        : [];\n\n      if (reviewCandidates.length > 0) {\n        showToast(\n          "info",\n          "Candidatos para revisão",\n          `${reviewCandidates.length} ação(ões) explícita(s) encontrada(s) em [[${note.title}]]. Nenhuma tarefa foi criada automaticamente; revise e registre em Executar somente o que fizer sentido.`\n        );\n      } else {\n        showToast(\n          "info",\n          "Nenhuma tarefa criada",\n          `Nenhum candidato explícito foi encontrado em [[${note.title}]]. O Nisti não cria tarefas por inferência.`\n        );\n      }\n'''
          text = text[:start] + replacement + text[end:]
          app.write_text(text, encoding='utf-8')

          # Criar: explicit planning asks for date AND priority before persisting.
          replace(
              'src/components/ContentView.tsx',
              'import type { CreativeScript, EditorialItem, IdeaItem, ObsidianNote } from "../types";',
              'import type { CreativeScript, EditorialItem, IdeaItem, ObsidianNote, TaskPriority } from "../types";'
          )
          replace(
              'src/components/ContentView.tsx',
              '  const [planningTime, setPlanningTime] = useState("");\n  const [planningError, setPlanningError] = useState("");',
              '  const [planningTime, setPlanningTime] = useState("");\n  const [planningPriority, setPlanningPriority] = useState<TaskPriority | "">("");\n  const [planningError, setPlanningError] = useState("");'
          )
          replace(
              'src/components/ContentView.tsx',
              '    setPlanningTime("");\n    setPlanningError("");',
              '    setPlanningTime("");\n    setPlanningPriority("");\n    setPlanningError("");',
              count=2
          )
          replace(
              'src/components/ContentView.tsx',
              '        scheduledTime: planningTime,\n        status: "IN_PRODUCTION",',
              '        scheduledTime: planningTime,\n        priority: planningPriority,\n        status: "IN_PRODUCTION",'
          )
          replace(
              'src/components/ContentView.tsx',
              '      setPlanningTime("");\n      await refreshEditorialItems();',
              '      setPlanningTime("");\n      setPlanningPriority("");\n      await refreshEditorialItems();'
          )
          replace(
              'src/components/ContentView.tsx',
              '                <h2 className="mt-1 text-lg font-black">Escolha a data de publicação</h2>',
              '                <h2 className="mt-1 text-lg font-black">Escolha data e prioridade</h2>'
          )
          replace(
              'src/components/ContentView.tsx',
              '            <div className="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-3">\n              <label><span className="block text-[10px] uppercase text-text-secondary font-bold mb-1">Data *</span><input type="date" value={planningDate} onChange={(event) => setPlanningDate(event.target.value)} className="w-full bg-background border border-outline-border rounded-lg px-3 py-2 text-sm outline-none" /></label>\n              <label><span className="block text-[10px] uppercase text-text-secondary font-bold mb-1">Horário opcional</span><input type="time" value={planningTime} onChange={(event) => setPlanningTime(event.target.value)} className="w-full bg-background border border-outline-border rounded-lg px-3 py-2 text-sm outline-none" /></label>\n            </div>',
              '            <div className="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3">\n              <label><span className="block text-[10px] uppercase text-text-secondary font-bold mb-1">Data *</span><input type="date" value={planningDate} onChange={(event) => setPlanningDate(event.target.value)} className="w-full bg-background border border-outline-border rounded-lg px-3 py-2 text-sm outline-none" /></label>\n              <label><span className="block text-[10px] uppercase text-text-secondary font-bold mb-1">Horário opcional</span><input type="time" value={planningTime} onChange={(event) => setPlanningTime(event.target.value)} className="w-full bg-background border border-outline-border rounded-lg px-3 py-2 text-sm outline-none" /></label>\n              <label><span className="block text-[10px] uppercase text-text-secondary font-bold mb-1">Prioridade *</span><select value={planningPriority} onChange={(event) => setPlanningPriority(event.target.value as TaskPriority | "")} className="w-full bg-background border border-outline-border rounded-lg px-3 py-2 text-sm outline-none"><option value="">Selecione</option><option value="low">Baixa</option><option value="medium">Média</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label>\n            </div>'
          )
          replace(
              'src/components/ContentView.tsx',
              'disabled={isPlanning || !planningDate}',
              'disabled={isPlanning || !planningDate || !planningPriority}'
          )

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/VaultView.tsx src/components/ContentView.tsx
          git diff --cached --check
          git commit -m "fix: finalize explicit planning and task review"
          git push origin HEAD:main

# trigger: 2
