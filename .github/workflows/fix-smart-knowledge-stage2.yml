name: Fix Smart Knowledge Stage 2

on:
  push:
    branches:
      - "feat/3.1-smart-knowledge-stage2"
    paths:
      - "scripts/fix-smart-knowledge-stage2.mjs"
      - ".github/workflows/fix-smart-knowledge-stage2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/3.1-smart-knowledge-stage2
          fetch-depth: 0

      - name: Apply hardening fixes
        run: node scripts/fix-smart-knowledge-stage2.mjs

      - name: Remove one-shot fixer
        run: |
          rm scripts/fix-smart-knowledge-stage2.mjs
          rm .github/workflows/fix-smart-knowledge-stage2.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Smart Knowledge Stage 2"
          git push origin HEAD:feat/3.1-smart-knowledge-stage2
