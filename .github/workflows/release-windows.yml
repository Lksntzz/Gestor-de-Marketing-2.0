name: Release Windows & Auto-Update

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v2.1.3). Deve corresponder ao package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Resolve and Validate Stable SemVer Release
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json deve usar SemVer estável X.Y.Z. Valor atual: $pkgVersion"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requested = "${{ inputs.version }}".Trim()
            $releaseTag = if ([string]::IsNullOrWhiteSpace($requested)) { "v$pkgVersion" } else { $requested }
          } elseif ("${{ github.ref_type }}" -eq "branch") {
            $releaseBranch = "${{ github.ref_name }}"
            if ($releaseBranch -notmatch '^release-v\d+\.\d+\.\d+$') {
              throw "Branch de release inválida: $releaseBranch"
            }
            $releaseTag = $releaseBranch -replace '^release-', ''
          } else {
            $releaseTag = "${{ github.ref_name }}"
          }

          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag inválida para canal stable: $releaseTag"
          }
          if ($releaseTag -ne "v$pkgVersion") {
            throw "Versão inconsistente: '$releaseTag' não corresponde a package.json 'v$pkgVersion'."
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$pkgVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release validado: $releaseTag"

      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify

      - name: Smoke Test Self-Contained Production Backend
        run: node scripts/runtime-smoke.mjs

      - name: Build Windows NSIS and Auto-Update Artifacts
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            Write-Host "Credenciais Authenticode detectadas. Compilando com assinatura."
            Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue
            bunx electron-builder@26.0.12 --win --x64 --publish never --config.win.forceCodeSigning=true
          } else {
            Write-Host "Certificado de assinatura não configurado. Compilando sem assinatura; SmartScreen poderá alertar."
            bunx electron-builder@26.0.12 --win --x64 --publish never
          }

      - name: Verify Generated Windows Update Assets
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path dist-electron -Filter *Setup*.exe)
          $latestYml = @(Get-ChildItem -Path dist-electron -Filter latest.yml)
          $blockmaps = @(Get-ChildItem -Path dist-electron -Filter *.blockmap)

          if ($nsis.Count -eq 0) { throw "Instalador NSIS Setup não foi gerado." }
          if ($latestYml.Count -eq 0) { throw "latest.yml não foi gerado." }
          if ($blockmaps.Count -eq 0) { throw "Nenhum .blockmap foi gerado para auto-update." }

          foreach ($file in @($nsis + $latestYml + $blockmaps)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | {1} bytes | SHA256 {2}" -f $file.Name, $file.Length, $hash)
          }

      # Não usamos actions/upload-artifact aqui: os mesmos binários seriam
      # armazenados duas vezes e consumiriam a cota de Actions Storage.
      # Os artefatos oficiais ficam somente em GitHub Releases deste repositório público.
      - name: Publish Release to This Public Repository
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Nisti Marketing ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-electron/*Setup*.exe
            dist-electron/latest.yml
            dist-electron/*.blockmap
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
