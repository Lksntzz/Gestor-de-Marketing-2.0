name: Release Windows & Auto-Update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v2.1.11). Deve corresponder ao package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Resolve and Validate Stable SemVer Release
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json deve usar SemVer estável X.Y.Z. Valor atual: $pkgVersion"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requested = "${{ inputs.version }}".Trim()
            $releaseTag = if ([string]::IsNullOrWhiteSpace($requested)) { "v$pkgVersion" } else { $requested }
          } else {
            $releaseTag = "${{ github.ref_name }}"
          }

          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag inválida para canal stable: $releaseTag"
          }
          if ($releaseTag -ne "v$pkgVersion") {
            throw "Versão inconsistente: '$releaseTag' não corresponde a package.json 'v$pkgVersion'."
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$pkgVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release validado: $releaseTag"

      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify

      - name: Smoke Test Self-Contained Production Backend
        run: node scripts/runtime-smoke.mjs

      - name: Build Windows NSIS and Auto-Update Artifacts
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -and -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            Write-Host "Credenciais Authenticode detectadas. Compilando com assinatura."
            Remove-Item Env:CSC_IDENTITY_AUTO_DISCOVERY -ErrorAction SilentlyContinue
            bunx electron-builder@26.0.12 --win --x64 --publish never --config.win.forceCodeSigning=true
          } else {
            Write-Host "Certificado de assinatura não configurado. Compilando sem assinatura; SmartScreen poderá alertar."
            bunx electron-builder@26.0.12 --win --x64 --publish never
          }

      - name: Verify Generated Windows Update Assets
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path dist-electron -Filter Nisti-Marketing-Setup-*.exe)
          $latestYml = @(Get-ChildItem -Path dist-electron -Filter latest.yml)
          $blockmaps = @(Get-ChildItem -Path dist-electron -Filter Nisti-Marketing-Setup-*.exe.blockmap)

          if ($nsis.Count -ne 1) { throw "Esperado exatamente um instalador NSIS com nome estável. Encontrados: $($nsis.Count)." }
          if ($latestYml.Count -ne 1) { throw "latest.yml não foi gerado." }
          if ($blockmaps.Count -ne 1) { throw "Esperado exatamente um .blockmap do Setup. Encontrados: $($blockmaps.Count)." }

          foreach ($file in @($nsis + $latestYml + $blockmaps)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | {1} bytes | SHA256 {2}" -f $file.Name, $file.Length, $hash)
          }

      - name: Validate latest.yml Artifact References
        shell: pwsh
        run: |
          $latestPath = Join-Path "dist-electron" "latest.yml"
          $latest = Get-Content $latestPath -Raw
          $pathMatch = [regex]::Match($latest, '(?m)^path:\s*(.+?)\s*$')
          if (-not $pathMatch.Success) {
            throw "latest.yml não contém a chave path esperada pelo electron-updater."
          }

          $expectedSetup = $pathMatch.Groups[1].Value.Trim().Trim('"').Trim("'")
          if ($expectedSetup -match '\s') {
            throw "O instalador referenciado por latest.yml contém espaços e pode ser normalizado pelo GitHub: '$expectedSetup'."
          }
          if ($expectedSetup -notmatch '^Nisti-Marketing-Setup-\d+\.\d+\.\d+\.exe$') {
            throw "Nome inesperado no latest.yml: '$expectedSetup'."
          }

          $setupPath = Join-Path "dist-electron" $expectedSetup
          $blockmapPath = "$setupPath.blockmap"
          if (-not (Test-Path $setupPath)) {
            throw "latest.yml referencia '$expectedSetup', mas esse arquivo não existe no build."
          }
          if (-not (Test-Path $blockmapPath)) {
            throw "Blockmap correspondente não existe: '$expectedSetup.blockmap'."
          }

          "EXPECTED_SETUP_ASSET=$expectedSetup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "latest.yml validado contra os artefatos locais: $expectedSetup"

      - name: Smoke Test NSIS Installer Extraction
        shell: pwsh
        run: |
          $setup = Get-Item (Join-Path "dist-electron" $env:EXPECTED_SETUP_ASSET)
          $accessViolationExitCode = -1073741819 # 0xC0000005 on GitHub-hosted Windows runners
          $maxAttempts = 3
          $installed = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $installDir = Join-Path $env:RUNNER_TEMP "nisti-install-smoke-$attempt"
            Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue

            Write-Host "Smoke NSIS tentativa $attempt/$maxAttempts em $installDir"
            $process = Start-Process -FilePath $setup.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru

            if ($process.ExitCode -eq 0) {
              $appExe = Join-Path $installDir "Nisti Marketing.exe"
              if (-not (Test-Path $appExe)) {
                $found = @(Get-ChildItem -Path $installDir -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
                throw "Instalação silenciosa terminou sem gerar 'Nisti Marketing.exe'. EXEs encontrados: $($found -join '; ')"
              }

              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-electron-smoke.ps1 -ExecutablePath $appExe
              Write-Host "Smoke test do instalador OK: $appExe"
              $installed = $true
              Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue
              break
            }

            if ($process.ExitCode -ne $accessViolationExitCode) {
              throw "Instalador NSIS falhou no smoke test com exit code não transitório $($process.ExitCode)."
            }

            Write-Warning "Runner retornou access violation 0xC0000005 na tentativa $attempt/$maxAttempts. Limpando e repetindo o mesmo instalador."
            Remove-Item -Path $installDir -Recurse -Force -ErrorAction SilentlyContinue
            if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 3 }
          }

          if (-not $installed) {
            throw "Instalador NSIS sofreu access violation 0xC0000005 nas $maxAttempts tentativas; release bloqueada."
          }

      # Não usamos actions/upload-artifact aqui: os mesmos binários seriam
      # armazenados duas vezes e consumiriam a cota de Actions Storage.
      # Os artefatos oficiais ficam somente em GitHub Releases deste repositório público.
      - name: Publish Release to This Public Repository
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Nisti Marketing ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-electron/Nisti-Marketing-Setup-*.exe
            dist-electron/latest.yml
            dist-electron/Nisti-Marketing-Setup-*.exe.blockmap
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Verify Published Update Feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers -Method Get
          $assetNames = @($release.assets | ForEach-Object { $_.name })

          $expected = @(
            "latest.yml",
            $env:EXPECTED_SETUP_ASSET,
            "$($env:EXPECTED_SETUP_ASSET).blockmap"
          )

          foreach ($name in $expected) {
            if ($assetNames -notcontains $name) {
              throw "Feed publicado inconsistente: asset esperado '$name' não existe. Assets remotos: $($assetNames -join ', ')"
            }
          }

          Write-Host "Feed remoto validado. latest.yml e assets usam nomes idênticos."
