name: Apply Task Priority Consolidation

on:
  push:
    branches: [ "refactor/product-consolidation" ]
    paths:
      - "scripts/apply-task-priority-consolidation.mjs"
      - ".github/workflows/apply-task-priority-consolidation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/product-consolidation
          fetch-depth: 0

      - name: Apply priority migration
        run: node scripts/apply-task-priority-consolidation.mjs

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/domain/appStateSchemas.ts src/domain/taskExtractor.ts src/components/ExecutionTasksView.tsx src/utils/executionIntelligence.ts
          git commit -m "fix: preserve unspecified task priority"
          git push origin HEAD:refactor/product-consolidation
