name: Windows Desktop Runtime Test

on:
  push:
    branches:
      - "main"
      - "build/windows-installer-20260831"
    paths:
      - "electron-main.ts"
      - "electron-bootstrap.ts"
      - "src/electron/**"
      - "src/main.tsx"
      - "src/index.css"
      - "src/components/**"
      - "src/services/ai/**"
      - "src/services/knowledge/index/**"
      - "src/services/workspaceBackupService.ts"
      - "src/domain/aiConnection.ts"
      - "src/domain/aiCredentialAnalysis.ts"
      - "src/domain/appStateSchemas.ts"
      - "src/domain/baseOnboarding.ts"
      - "src/types.ts"
      - "tests/aiConnection*.test.ts"
      - "tests/aiCredential*.test.ts"
      - "tests/workspaceBackup.test.ts"
      - "tests-node/baseOnboardingDesktop.test.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-v2-test.yml"
  pull_request:
    branches:
      - "main"
      - "master"
    paths:
      - "electron-main.ts"
      - "electron-bootstrap.ts"
      - "src/electron/**"
      - "src/main.tsx"
      - "src/index.css"
      - "src/components/**"
      - "src/services/ai/**"
      - "src/services/knowledge/index/**"
      - "src/services/workspaceBackupService.ts"
      - "src/domain/aiConnection.ts"
      - "src/domain/aiCredentialAnalysis.ts"
      - "src/domain/appStateSchemas.ts"
      - "src/domain/baseOnboarding.ts"
      - "src/types.ts"
      - "tests/aiConnection*.test.ts"
      - "tests/aiCredential*.test.ts"
      - "tests/workspaceBackup.test.ts"
      - "tests-node/baseOnboardingDesktop.test.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-v2-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime-and-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify

      - name: Smoke Test Self-Contained Production Backend
        run: node scripts/runtime-smoke.mjs

      - name: Build Unsigned Windows NSIS and Portable Test Artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder@26.0.12 --win --x64 --publish never

      - name: Launch Electron, Verify Runtime and Capture UI Preview
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-electron-smoke.ps1 -ExecutablePath "dist-electron/win-unpacked/Nisti Marketing.exe" -ScreenshotPath "artifacts/nisti-ui-preview.png"

      - name: Upload UI Preview
        if: always() && hashFiles('artifacts/nisti-ui-preview.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nisti-ui-preview-${{ github.run_number }}
          path: artifacts/nisti-ui-preview.png
          retention-days: 3
          if-no-files-found: error

      - name: Verify Windows Test Artifacts
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path dist-electron -Filter *.exe)
          if ($executables.Count -eq 0) {
            throw "Nenhum executável Windows de teste foi gerado."
          }
          foreach ($exe in $executables) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | {1} bytes | SHA256 {2}" -f $exe.Name, $exe.Length, $hash)
          }

      - name: Upload Windows Installer for Manual Validation
        uses: actions/upload-artifact@v4
        with:
          name: nisti-marketing-windows-installer-${{ github.run_number }}
          path: dist-electron/Nisti-Marketing-Setup-*.exe
          retention-days: 3
          if-no-files-found: error
