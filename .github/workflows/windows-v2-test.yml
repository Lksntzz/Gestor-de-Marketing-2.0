name: Windows Desktop Runtime Test

on:
  push:
    branches:
      - "main"
    paths:
      - "electron-main.ts"
      - "electron-bootstrap.ts"
      - "src/electron/**"
      - "src/services/knowledge/index/**"
      - "src/domain/baseOnboarding.ts"
      - "src/components/BaseOnboardingPanel.tsx"
      - "src/types.ts"
      - "tests-node/baseOnboardingDesktop.test.ts"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/windows-v2-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime-and-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript, Tests and Production Build
        run: bun run verify

      - name: Smoke Test Self-Contained Production Backend
        run: node scripts/runtime-smoke.mjs

      - name: Build Unsigned Windows NSIS and Portable Test Artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder@26.0.12 --win --x64 --publish never

      - name: Launch Electron and Verify Renderer, Preload and Backend
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-electron-smoke.ps1 -ExecutablePath "dist-electron/win-unpacked/Nisti Marketing.exe"

      - name: Verify Windows Test Artifacts
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path dist-electron -Filter *.exe)
          if ($executables.Count -eq 0) {
            throw "Nenhum executável Windows de teste foi gerado."
          }
          foreach ($exe in $executables) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | {1} bytes | SHA256 {2}" -f $exe.Name, $exe.Length, $hash)
          }

      # Os instaladores de teste são descartáveis e não são enviados para
      # actions/upload-artifact. Isso evita consumo recorrente de Actions Storage.
